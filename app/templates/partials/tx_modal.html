{% from "partials/macros.html" import icon %}
<dialog class="modal" id="tx-modal" aria-labelledby="tx-modal-title">
  <form method="post" action="{{ url_for('transactions.create') }}" data-create-action="{{ url_for('transactions.create') }}"
        data-tx-form data-defaults='{"kind": "expense", "date": "{{ today_iso() }}", "method": "UPI"}' style="display:contents">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="modal-head">
      <span class="modal-icon">{{ icon('receipt') }}</span>
      <div>
        <h3 id="tx-modal-title" data-modal-title>Add transaction</h3>
        <p>Record income or an expense to your ledger.</p>
      </div>
      <button type="button" class="icon-btn icon-btn-sm" data-modal-close aria-label="Close">{{ icon('x') }}</button>
    </div>
    <div class="modal-body">
      <div class="segmented segmented-lg" role="radiogroup" aria-label="Transaction type">
        <input type="radio" name="kind" value="expense" id="tx-kind-expense" class="seg-expense" checked>
        <label for="tx-kind-expense">{{ icon('arrow-up-right', 'icon-sm') }} Expense</label>
        <input type="radio" name="kind" value="income" id="tx-kind-income" class="seg-income">
        <label for="tx-kind-income">{{ icon('arrow-down-left', 'icon-sm') }} Income</label>
      </div>

      <div class="field" style="margin-top:18px">
        <label class="label" for="tx-title">Title</label>
        <input class="input" id="tx-title" name="title" required minlength="2" maxlength="80" placeholder="e.g. Grocery run at BigBasket" autocomplete="off">
      </div>
      <div class="form-row">
        <div class="field">
          <label class="label" for="tx-amount">Amount</label>
          <div class="input-prefix">
            <span>{{ currency_symbol or '₹' }}</span>
            <input class="input num" id="tx-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" max="100000000" required placeholder="0.00">
          </div>
        </div>
        <div class="field">
          <label class="label" for="tx-date">Date</label>
          <input class="input" id="tx-date" name="date" type="date" required>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label class="label" for="tx-category">Category</label>
          <select class="select" id="tx-category" name="category_id">
            <option value="">Uncategorised</option>
            <optgroup label="Expense" data-kind="expense">
              {% for c in all_categories or [] if c.kind == 'expense' %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </optgroup>
            <optgroup label="Income" data-kind="income">
              {% for c in all_categories or [] if c.kind == 'income' %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </optgroup>
          </select>
        </div>
        <div class="field">
          <label class="label" for="tx-method">Payment method</label>
          <select class="select" id="tx-method" name="method" required>
            {% for m in payment_methods or [] %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="field">
        <label class="label" for="tx-notes">Notes <span class="muted">(optional)</span></label>
        <textarea class="textarea" id="tx-notes" name="notes" maxlength="255" placeholder="Add a note…"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
      <button type="submit" class="btn btn-primary"><span data-mode="create">{{ icon('plus') }}</span><span data-mode="edit" hidden>{{ icon('check') }}</span>Save transaction</button>
    </div>
  </form>
</dialog>
